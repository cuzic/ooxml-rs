[package]
name = "ooxml-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Performance baseline for ooxml-rs (dev only, not published)"
publish = false
# Nothing here runs under `cargo test`: the library has no tests, and the
# benchmark is a `harness = false` bench target that only `cargo bench`
# (or an explicit `--bench`) builds and runs.
autotests = false
autobenches = false

[lib]
test = false
doctest = false
bench = false

[[bench]]
name = "baseline"
harness = false
test = false

[[bench]]
name = "breakdown"
harness = false
test = false

[dependencies]
ooxml-core = { workspace = true }
ooxml-xlsx = { path = "../ooxml-xlsx" }
ooxml-pptx = { path = "../ooxml-pptx" }
zip = { workspace = true }

[dev-dependencies]
quick-xml = { workspace = true }
calamine = "0.38"
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }
umya-spreadsheet = "2"
