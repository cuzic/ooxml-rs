[package]
name = "ooxml-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lossless Excel (.xlsx) editing on top of ooxml-core: Phase0 value edits and a from-scratch skeleton"
readme = "README.md"
include = ["src/**/*.rs", "template/blank.xlsx", "Cargo.toml", "README.md"]

[features]
# Test hook for ADR-0003 §7.3: make an edit fail inside its apply phase.
fault-injection = []

[dependencies]
ooxml-core = { workspace = true }
ooxml-schema = { workspace = true, features = ["sml", "props"] }
quick-xml = { workspace = true }
regex = "1"
sha2 = "0.11"
thiserror = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
calamine = { version = "0.38", features = ["picture"] }
rust_xlsxwriter = { version = "0.102", default-features = false }
zip = { workspace = true }
proptest = "1"

[[example]]
# Unique across the workspace: three crates have a manual check and cargo warns
# about (and may later refuse) same-named example targets. The source file keeps
# its name so open PRs that edit it do not conflict.
name = "xlsx_manual_check"
path = "examples/manual_check.rs"
