[package]
name = "ooxml-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lossless Excel (.xlsx) editing on top of ooxml-core: Phase0 value edits and a from-scratch skeleton"
readme = "README.md"
include = ["src/**/*.rs", "template/blank.xlsx", "Cargo.toml", "README.md"]

[features]
# Test hook for ADR-0003 §7.3: make an edit fail inside its apply phase.
fault-injection = []

[dependencies]
ooxml-core = { workspace = true }
ooxml-schema = { workspace = true, features = ["sml"] }
quick-xml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
calamine = "0.38"
zip = { workspace = true }
