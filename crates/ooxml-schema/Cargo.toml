[package]
name = "ooxml-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Generated OOXML schema tables and typed views over ooxml-core's lossless XML tree"
readme = "README.md"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "THIRD-PARTY-NOTICES"]

[dependencies]
ooxml-core = { workspace = true }

[features]
default = ["sml"]
sml = []
wml = []
pml = []
dml = []
props = []
