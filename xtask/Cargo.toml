[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Code generator for ooxml-rs (`cargo xtask codegen [--check]`, ADR-0002) and the manual-check bundle (`cargo xtask manual-check`)"

[dependencies]
quick-xml = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
# Pinned: generated output must not change with a formatter update (ADR-0002 §2).
syn = { version = "=3.0.10", default-features = false, features = ["full", "parsing", "printing"] }
prettyplease = "=0.3.0"
# manual-check bundle (`cargo xtask manual-check`).
zip = { workspace = true }
