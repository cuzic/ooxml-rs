[workspace]
resolver = "3"
members = [
    "crates/ooxml-core",
    "crates/ooxml-schema",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuzic/ooxml-rs"
authors = ["Tomoya Kawanishi"]

[workspace.dependencies]
ooxml-core = { path = "crates/ooxml-core", version = "0.1.0" }
ooxml-schema = { path = "crates/ooxml-schema", version = "0.1.0", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
thiserror = "2"
