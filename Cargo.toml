[workspace]
resolver = "3"
# Glob so that format crates (crates/ooxml-xlsx, -docx, -pptx) can be added in
# parallel PRs without conflicting edits to this list.
members = [
    "crates/*",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuzic/ooxml-rs"
authors = ["Tomoya Kawanishi"]

[workspace.dependencies]
ooxml-core = { path = "crates/ooxml-core", version = "0.1.0" }
ooxml-schema = { path = "crates/ooxml-schema", version = "0.1.0", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
thiserror = "2"
# zip already depends on 0.4: one version in the tree (PR #58 round 1 m3)
getrandom = "0.4"
