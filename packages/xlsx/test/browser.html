<!doctype html>
<meta charset="utf-8">
<title>XLSX browser compatibility smoke test</title>
<body>Running</body>
<script type="module">
  function check(condition, message) {
    if (!condition) throw new Error(message);
  }

  function equalBytes(a, b) {
    return a.length === b.length && a.every((byte, index) => byte === b[index]);
  }

  function mustThrow(action, code, message) {
    try {
      action();
    } catch (error) {
      check(error.code === code, 'Expected ' + code + ', got ' + error);
      if (message !== undefined) check(error.message === message, 'Unexpected error message: ' + error.message);
      return;
    }
    throw new Error('Expected ' + code);
  }

  try {
    const [{ Workbook, ValueType, FormulaType, ErrorValue }, SheetJS] = await Promise.all([
      import('../src/exceljs.js'),
      import('../src/sheetjs.js'),
    ]);
    const emptyWorkbook = new Workbook();
    emptyWorkbook.creator = 'Browser empty workbook';
    emptyWorkbook.properties.date1904 = true;
    const emptyBytes = await emptyWorkbook.xlsx.writeBuffer({ useSharedStrings: false });
    const reopenedEmpty = await new Workbook().xlsx.load(emptyBytes);
    check(reopenedEmpty.worksheets.length === 0 && reopenedEmpty.creator === emptyWorkbook.creator &&
      reopenedEmpty.properties.date1904, 'ExcelJS zero-sheet workbook metadata changed');
    const firstSheet = reopenedEmpty.addWorksheet('First');
    check(firstSheet.id === 1, 'ExcelJS zero-sheet workbook allocated the wrong first worksheet ID');
    firstSheet.getCell('A1').value = 42;
    const withFirstSheet = await new Workbook().xlsx.load(await reopenedEmpty.xlsx.writeBuffer());
    check(withFirstSheet.getWorksheet('First').getCell('A1').value === 42,
      'ExcelJS could not persist the first worksheet added to a zero-sheet workbook');
    const { utils } = SheetJS;
    check(SheetJS.version === '0.20.3' && SheetJS.default.utils === utils &&
      utils.consts.SHEET_VERY_HIDDEN === 2, 'SheetJS API metadata exports failed');
    let decoded = 0;
    SheetJS.set_cptable({ utils: { decode(codepage, bytes) {
      decoded += 1;
      check(codepage === 437 && bytes[0] === 0x82, 'Unexpected codepage decoding request');
      return 'é,2';
    } } });
    try {
      check(SheetJS.read(Uint8Array.of(0x82, 0x2C, 0x32), { codepage: 437 }).Sheets.Sheet1.A1.v === 'é',
        'SheetJS ignored the injected codepage decoder');
      check(SheetJS.read(new TextEncoder().encode('\uFEFF文,2'), { codepage: 437 }).Sheets.Sheet1.A1.v === '文' &&
        decoded === 1, 'An explicit Unicode BOM did not take precedence');
    } finally {
      SheetJS.set_cptable(undefined);
    }

    const storedFiles = new Map();
    const writeError = new Error('simulated file write failure');
    SheetJS.set_fs({
      readFileSync: name => storedFiles.get(name),
      writeFileSync: (name, bytes) => storedFiles.set(name, bytes),
      writeFile: (name, bytes, callback) => queueMicrotask(() => {
        if (name === 'error.xlsx') callback(writeError);
        else {
          storedFiles.set(name, bytes);
          callback(null);
        }
      }),
    });
    try {
      const fileBook = utils.book_new(utils.aoa_to_sheet([[23]]));
      SheetJS.writeFileSync(fileBook, 'book.xlsx');
      const projected = SheetJS.read(storedFiles.get('book.xlsx'), { bookFiles: true });
      check(SheetJS.parse_zip({ files: projected.files }).Sheets.Sheet1.A1.v === 23,
        'SheetJS ZIP container projection did not reopen');

      const zipOptions = Object.defineProperties({}, {
        type: { get() { throw new Error('ZIP type getter must not run'); } },
        cellText: { value: false },
      });
      const decodedZip = SheetJS.parse_zip({ files: projected.files }, zipOptions);
      check(decodedZip.Sheets.Sheet1.A1.v === 23 && decodedZip.Sheets.Sheet1.A1.w === undefined,
        'ZIP byte input did not preserve read option descriptors');
      const zipBytes = storedFiles.get('book.xlsx');
      const binaryZip = String.fromCharCode(...zipBytes.subarray(0, 12), 0xd800 + zipBytes[12],
        0xdc00 + zipBytes[13], ...zipBytes.subarray(14));
      check(SheetJS.read(binaryZip, { type: 'binary' }).Sheets.Sheet1.A1.v === 23 &&
        SheetJS.parse_zip({ files: { 'Index.zip': { content: binaryZip } } }).Sheets.Sheet1.A1.v === 23,
        'SheetJS binary ZIP input did not retain both UTF-16 code units');
      const nestedZip = { files: {
        'Index.zip': { content: storedFiles.get('book.xlsx') },
        'unused.txt': { get content() { throw new Error('Unrelated ZIP entry was read'); } },
      } };
      check(SheetJS.parse_zip(nestedZip).Sheets.Sheet1.A1.v === 23,
        'SheetJS nested ZIP fallback read an unrelated entry or lost case-insensitive detection');
      check(SheetJS.parse_zip({ files: { 'Index.zip': { content: new Uint8Array() }, ...projected.files } }).Sheets.Sheet1.A1.v === 23,
        'SheetJS package manifest did not take precedence over the nested ZIP entry');
      mustThrow(() => SheetJS.parse_zip({ files: {
        ...projected.files,
        'Invalid\uD800.txt': { get content() { throw new Error('Invalid ZIP entry body was read'); } },
      } }), 'INVALID_INPUT', 'Invalid ZIP entry name');
      check(SheetJS.readFileSync === SheetJS.readFile && SheetJS.readFile('book.xlsx').Sheets.Sheet1.A1.v === 23,
        'SheetJS injected filesystem XLSX round trip failed');
      check(SheetJS.read('book.xlsx', { type: 'file', bookSheets: true }).SheetNames[0] === 'Sheet1',
        'SheetJS file input did not apply projection options');
      await new Promise((resolve, reject) => {
        SheetJS.writeFileAsync('book.csv', fileBook, error => error ? reject(error) : resolve());
      });
      check(SheetJS.readFile('book.csv', { raw: true }).Sheets.Sheet1.A1.v === '23',
        'SheetJS asynchronous file write did not infer CSV');
      SheetJS.writeFile(fileBook, 'book.HTM', { bookType: undefined });
      check(new TextDecoder().decode(storedFiles.get('book.HTM')).includes('<table'),
        'SheetJS writeFile did not infer HTML from the HTM extension');
      const error = await new Promise(resolve => SheetJS.writeFileAsync('error.xlsx', fileBook, {}, resolve));
      check(error === writeError, 'SheetJS asynchronous file write lost filesystem error');
    } finally {
      SheetJS.set_fs(undefined);
    }

    check(utils.encode_cell({ r: 1048575, c: 16383 }) === 'XFD1048576', 'A1 encoding failed');
    check(utils.encode_range(utils.decode_range('$A$1:$C$3')) === 'A1:C3', 'A1 range round trip failed');
    const singleRange = utils.decode_range('$XFD$1048576');
    check(singleRange.s !== singleRange.e && singleRange.e.r === 1048575 && singleRange.e.c === 16383 &&
      utils.decode_col('💠') === 1494033, 'A1 parsing lost endpoint identity or UTF-16 column behavior');
    const created = utils.aoa_to_sheet([[1, , true]], { dense: true });
    check(utils.sheet_add_aoa(created, [[2]], { origin: -1 }) === created, 'AOA append identity failed');
    const rows = utils.sheet_to_json(created, { header: 1 });
    check(rows[0][2] === true && rows[1][0] === 2, 'AOA round trip failed');
    check(utils.sheet_to_csv(created) === '1,,TRUE\n2,,', 'CSV export failed');
    check(utils.sheet_to_txt(created) === '1\t\tTRUE\n2\t\t', 'TXT export failed');
    const ssf = SheetJS.SSF;
    const customFormat = ssf.load('00000.00', 200);
    check(ssf.get_table() === ssf._table && ssf.format(customFormat, 42.125) === '00042.13',
      'SheetJS SSF did not resolve a registered format');
    check(ssf.is_date('[h]:mm:ss') && !ssf.is_date('0.00 "months"') &&
      ssf.parse_date_code(60).d === 29 && ssf.parse_date_code(0, { date1904: true }).y === 1904 &&
      ssf.parse_date_code(-1) === null, 'SheetJS SSF date handling failed');
    check(ssf.format(15, 60) === '29-Feb-00' && ssf.format(22, 45000.5) === '3/15/23 12:00' &&
      ssf.format(46, 1.5) === '36:00:00' && ssf.format('dddd, mmmm d, yyyy', 45000) ===
      'Wednesday, March 15, 2023', 'SheetJS SSF calendar or elapsed time formatting failed');
    check(ssf.format(11, 1234.5) === '1.23E+03' && ssf.format(48, 0.00012) === '120.0E-6' &&
      ssf.format(37, -1234.5) === '(1,235)' && ssf.format(37, 1234.5) === '1,235 ' &&
      utils.format_cell({ t: 'n', z: 40, v: -1234.5 }) === '(1,234.50)',
      'SheetJS scientific or negative-section number display failed');
    check(ssf.format(12, -0.125) === '- 1/8' && ssf.format(13, 2.25) === '2  1/4 ' &&
      ssf.format(13, 1) === '1      ' && ssf.format('# ?/16', 2.25) === '2 4/16',
      'SheetJS mixed fraction display failed');
    check(ssf.format(44, -1234.5) === ' $(1,234.50)' && ssf.format(43, 0) === ' -   ' &&
      ssf.format(42, 'memo') === ' memo ' && utils.format_cell({ t: 'n', z: 5, v: 1234.5 }) === '1,235 ',
      'SheetJS accounting or implicit currency display failed');
    check(ssf.format(27, 45000) === '3/15/23' && ssf.format(59, -1234.5) === '-1234' &&
      ssf.format(65, -1234.5) === '($1,234.50)' &&
      ssf.format(56, 0.5) === '上午/下午 12時00分00秒 ' &&
      ssf.format(27, 45000, { table: { 14: 'yyyy-mm-dd' } }) === '2023-03-15',
      'SheetJS built-in format alias or fallback failed');
    const sectionFormat = '0.0;[Red](0.0);"zero";"label: "@';
    check(ssf.format(sectionFormat, -2.5) === '(2.5)' && ssf.format(sectionFormat, 0) === 'zero' &&
      ssf.format(sectionFormat, 'abc') === 'label: abc' && ssf.format(sectionFormat, true) === 'label: TRUE' &&
      ssf.format('[>=100]0.0" kg";[<0](0.0);0.0', 123.7) === '123.7 kg',
      'SheetJS custom format section selection failed');
    check(ssf.format('0.0"x;y";(0.0)', -2.5) === '' &&
      ssf.format('0.0"x;y";(0.0)', 0) === '(0.0)' &&
      ssf.format('0.0"x;y";(0.0)', 2.5) === '2.5x' &&
      ssf.format('0.0;0.0;@', 0) === '0.0',
      'SheetJS quoted separator or trailing text section differed from the reference');
    check(ssf.format('General', 123456789123) === '1.23457E+11' &&
      ssf.format('general', 0.0000000942315678) === '9.42316E-08' &&
      ssf.format(0, Infinity) === '#DIV/0!' && ssf.format(0, NaN) === '#NUM!' &&
      ssf.format('General', new Date('2023-02-01T00:00:00Z')) === '2/1/23',
      'SheetJS General display differed from the reference');
    check(ssf.format('0.0, "k"', -1250) === '-1.2 k' &&
      ssf.format('#,##0,,', 1234567) === '1' && ssf.format('0.0#', 1250) === '1250.0' &&
      ssf.format('0.##%', 0.125) === '12.5%', 'SheetJS scaling or optional decimal digits failed');
    SheetJS.stream.set_readable((options) => ({
      options, chunks: [], push(chunk) { this.chunks.push(chunk); },
    }));
    const csvStream = SheetJS.stream.to_csv(created, { RS: '\r\n' });
    check(csvStream.chunks.length === 0, 'SheetJS stream ran before its first read');
    const drain = (stream) => {
      while (stream.chunks.at(-1) !== null) stream._read();
      return stream.chunks.slice(0, -1);
    };
    check(drain(csvStream).join('') === '\uFEFF1,,TRUE\r\n2,,', 'SheetJS CSV stream lost BOM or row separators');
    const jsonStream = SheetJS.stream.to_json(created, { header: 1 });
    check(jsonStream.options.objectMode && JSON.stringify(drain(jsonStream)) === JSON.stringify(rows),
      'SheetJS JSON stream lost object mode or row values');
    check(drain(SheetJS.stream.to_html(created, { id: 'export' })).join('') ===
      utils.sheet_to_html(created, { id: 'export' }), 'SheetJS HTML stream lost the table wrapper or rows');
    const xlmlDraft = utils.book_new(utils.aoa_to_sheet([[1, '<tag>'], [], [true]]), 'T&X');
    xlmlDraft.Sheets['T&X'].A1.c = [{ a: 'Editor', t: 'A & B\nReview' }];
    xlmlDraft.Sheets['T&X'].A1.c.hidden = true;
    xlmlDraft.Sheets['T&X']['!margins'] = { top: 0.8, bottom: 0.9, left: 0, right: 0.4, header: 0.15, footer: 0.25 };
    xlmlDraft.Sheets['T&X'].A1.l = { Target: 'https://example.org/', Tooltip: 'Open' };
    xlmlDraft.Sheets['T&X']['!rows'] = [{ hpt: 15 }, { hidden: true }];
    xlmlDraft.Sheets['T&X']['!cols'] = [{ wpx: 60 }, { wch: 8, hidden: true }];
    xlmlDraft.Sheets['T&X']['!autofilter'] = { ref: 'A1:B3' };
    xlmlDraft.Props = { Title: 'A & B', Author: 'Original' };
    xlmlDraft.Custprops = { Reviewed: true, Count: 3 };
    xlmlDraft.Workbook = { Names: [
      { Name: 'Input', Ref: "'T&X'!$A$1" }, { Name: 'Local', Ref: '$B$1', Sheet: 0 },
    ] };
    const xlmlParts = drain(SheetJS.stream.to_xlml(xlmlDraft, { stride: 1, Props: { Author: 'Override' } }));
    const xlmlText = xlmlParts.join('');
    const xlmlDocument = new DOMParser().parseFromString(xlmlText, 'application/xml');
    check(xlmlParts.filter((chunk) => chunk.startsWith('<Row')).length === 3 &&
      xlmlDocument.querySelector('Worksheet').getAttribute('ss:Name') === 'T&X' &&
      xlmlDocument.querySelectorAll('Cell > Data')[1].textContent === '<tag>' &&
      xlmlDocument.querySelectorAll('Cell > Data')[2].getAttribute('ss:Type') === 'Boolean',
      'SheetJS SpreadsheetML streaming lost row boundaries or typed data');
    check(xlmlDocument.querySelectorAll('Column')[1].getAttribute('ss:Width') === '53' &&
      xlmlDocument.querySelectorAll('Column')[1].getAttribute('ss:Hidden') === '1' &&
      xlmlDocument.querySelectorAll('Row')[0].getAttribute('ss:Height') === '15' &&
      xlmlDocument.querySelectorAll('Row')[1].getAttribute('ss:Hidden') === '1' &&
      xlmlDocument.querySelector('AutoFilter').getAttribute('x:Range') === 'R1C1:R3C2',
      'SheetJS SpreadsheetML streaming lost worksheet layout metadata');
    check(xlmlDocument.querySelector('Title').textContent === 'A & B' &&
      xlmlDocument.querySelector('Author').textContent === 'Override' &&
      xlmlDocument.querySelector('Reviewed').getAttribute('dt:dt') === 'boolean' &&
      xlmlDocument.querySelector('Workbook > Names > NamedRange').getAttribute('ss:RefersTo') === "='T&X'!R1C1" &&
      xlmlDocument.querySelector('Worksheet > Names > NamedRange').getAttribute('ss:RefersTo') === '=R1C2',
      'SheetJS SpreadsheetML streaming lost document properties or named formulas');
    const xlmlWriteOptions = { bookType: 'xml', Props: { Author: 'Override' } };
    const xlmlBuffer = SheetJS.write(xlmlDraft, { ...xlmlWriteOptions, type: 'buffer' });
    check(SheetJS.write(xlmlDraft, { ...xlmlWriteOptions, type: 'string' }) === xlmlText &&
      new TextDecoder().decode(xlmlBuffer) === xlmlText &&
      equalBytes(new Uint8Array(SheetJS.write(xlmlDraft, { ...xlmlWriteOptions, type: 'array' })), xlmlBuffer) &&
      SheetJS.write(xlmlDraft, { ...xlmlWriteOptions, type: 'base64' }) === btoa(
        SheetJS.write(xlmlDraft, { ...xlmlWriteOptions, type: 'binary' })),
      'SheetJS buffered SpreadsheetML output differed from the stream');
    const downloads = new Map();
    const captureDownload = (event) => {
      if (!['report.xml', 'report.txt', 'report.xlam'].includes(event.target.download)) return;
      event.preventDefault();
      downloads.set(event.target.download, fetch(event.target.href));
    };
    document.addEventListener('click', captureDownload);
    try {
      SheetJS.writeFile(xlmlDraft, 'report.xml', { Props: { Author: 'Override' } });
      const xmlDownload = await downloads.get('report.xml');
      check(xmlDownload?.headers.get('content-type') === 'application/xml;charset=utf-8' &&
        await xmlDownload.text() === xlmlText,
        'SheetJS .xml download changed the MIME type or SpreadsheetML output');
      SheetJS.writeFile(xlmlDraft, 'report.txt');
      const txtDownload = await downloads.get('report.txt');
      const txtBytes = SheetJS.write(xlmlDraft, { bookType: 'txt', type: 'array' });
      check(txtDownload?.headers.get('content-type') === 'text/plain;charset=utf-16le' &&
        equalBytes(new Uint8Array(await txtDownload.arrayBuffer()), new Uint8Array(txtBytes)),
      'SheetJS .txt download changed the MIME type or encoded bytes');
      SheetJS.writeFile(utils.book_new(created), 'report.xlam');
      const addinDownload = await downloads.get('report.xlam');
      check(addinDownload?.headers.get('content-type') === 'application/vnd.ms-excel.addin.macroenabled.12' &&
        SheetJS.read(await addinDownload.arrayBuffer()).Sheets.Sheet1.A1.v === 1,
      'SheetJS .xlam download changed the MIME type or workbook content');
    } finally {
      document.removeEventListener('click', captureDownload);
    }
    const xlmlFormulas = utils.book_new({
      '!ref': 'C2:D3',
      C2: { t: 'n', f: 'SUM(A1:B2)+$B3+C$2+$D$1', v: 4 },
      D2: { t: 's', f: 'IF(C2>0,"A1","B2")', v: 'A1' },
      C3: { t: 'n', f: 'SUM(A1:B2)', F: 'C3:D3', v: 4 },
      D3: { t: 'n', F: 'C3:D3', v: 5 },
    });
    const xlmlFormulaText = drain(SheetJS.stream.to_xlml(xlmlFormulas)).join('');
    const xlmlFormulaCells = new DOMParser().parseFromString(xlmlFormulaText, 'application/xml').querySelectorAll('Cell');
    check(xlmlFormulaCells[0].getAttribute('ss:Formula') === '=SUM(R[-1]C[-2]:RC[-1])+R[1]C2+R2C+R1C4' &&
      xlmlFormulaCells[1].getAttribute('ss:Formula') === '=IF(RC[-1]>0,"A1","B2")' &&
      xlmlFormulaCells[2].getAttribute('ss:ArrayRange') === 'RC:RC[1]' &&
      !xlmlFormulaCells[3].hasAttribute('ss:ArrayRange'),
      'SheetJS SpreadsheetML streaming lost the formula or array references');
    const reopenedXlml = SheetJS.read(xlmlBuffer, { cellNF: true, dense: true });
    const reopenedXlmlGrid = reopenedXlml.Sheets['T&X']['!data'];
    check(reopenedXlml.bookType === 'xlml' && reopenedXlmlGrid[0][1].v === '<tag>' &&
      reopenedXlmlGrid[2][0].t === 'b' && reopenedXlmlGrid[2][0].w === 'TRUE' &&
      reopenedXlmlGrid[0][0].z === 'General',
      'SheetJS SpreadsheetML reader lost typed data or number formats');
    check(reopenedXlml.Props.Author === 'Override' && reopenedXlml.Custprops.Reviewed === true &&
      reopenedXlml.Workbook.Names[0].Ref === "'T&X'!$A$1" &&
      reopenedXlml.Workbook.Names[1].Ref === '$B$1' && reopenedXlml.Workbook.Names[1].Sheet === 0,
      'SheetJS SpreadsheetML reader lost workbook properties or named formula scope');
    const xlmlMetadataOnly = SheetJS.read(xlmlText, { type: 'string', bookProps: true });
    check(xlmlMetadataOnly.Sheets === undefined && xlmlMetadataOnly.Props.Title === 'A & B' &&
      xlmlMetadataOnly.SheetNames[0] === 'T&X', 'SheetJS SpreadsheetML metadata-only load projected cells');
    const reopenedXlmlSheet = reopenedXlml.Sheets['T&X'];
    check(reopenedXlmlSheet['!cols'][1].wpx === 53 && reopenedXlmlSheet['!cols'][1].hidden &&
      reopenedXlmlSheet['!rows'][0].hpt === 15 && reopenedXlmlSheet['!rows'][1].hidden &&
      reopenedXlmlSheet['!autofilter'].ref === 'A1:B3' &&
      reopenedXlmlGrid[0][0].l.Tooltip === 'Open',
      'SheetJS SpreadsheetML reader lost layout metadata or hyperlink');
    check(reopenedXlmlGrid[0][0].c[0].a === 'Editor' &&
      reopenedXlmlGrid[0][0].c[0].t === 'A & B\nReview' && reopenedXlmlGrid[0][0].c.hidden &&
      reopenedXlmlSheet['!margins'].left === 0 && reopenedXlmlSheet['!margins'].footer === 0.25,
      'SheetJS SpreadsheetML reader lost the comment or print margins');
    const reopenedXlmlFormulas = SheetJS.read(xlmlFormulaText, { type: 'string' });
    check(reopenedXlmlFormulas.Sheets.Sheet1.C2.f === 'SUM(A1:B2)+$B3+C$2+$D$1' &&
      reopenedXlmlFormulas.Sheets.Sheet1.D2.f === 'IF(C2>0,"A1","B2")' &&
      SheetJS.read(xlmlFormulaText, { type: 'string', cellFormula: false }).Sheets.Sheet1.C2.f === undefined,
      'SheetJS SpreadsheetML reader lost ordinary formulas or the formula projection option');
    check(reopenedXlmlFormulas.Sheets.Sheet1.C3.F === 'C3:D3' &&
      reopenedXlmlFormulas.Sheets.Sheet1.D3.F === 'C3:D3' &&
      SheetJS.read(xlmlFormulaText, { type: 'string', cellFormula: false }).Sheets.Sheet1.D3.F === undefined,
      'SheetJS SpreadsheetML reader lost array formulas or the formula projection option');
    const xlmlMergeSheet = utils.aoa_to_sheet([[1, null, 3], [null, null, 4]]);
    xlmlMergeSheet['!merges'] = [utils.decode_range('A1:B2')];
    const xlmlMergeText = SheetJS.write(utils.book_new(xlmlMergeSheet), { bookType: 'xlml', type: 'string' });
    const reopenedXlmlMerge = SheetJS.read(xlmlMergeText, { type: 'string' }).Sheets.Sheet1;
    check(utils.encode_range(reopenedXlmlMerge['!merges'][0]) === 'A1:B2' && reopenedXlmlMerge.C2.v === 4,
      'SheetJS SpreadsheetML reader lost the merge or following cell');
    const xlmlDateStyle = '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
      'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      '<ExcelWorkbook xmlns="urn:schemas-microsoft-com:office:excel"><Date1904/></ExcelWorkbook>' +
      '<Styles><Style ss:ID="Date"><NumberFormat ss:Format="Short Date"/></Style>' +
      '<Style ss:ID="Child" ss:Parent="Date"/></Styles><Worksheet ss:Name="Dates"><Table><Row>' +
      '<Cell ss:StyleID="Child"><Data ss:Type="Number">0.5</Data></Cell>' +
      '<Cell><Data ss:Type="Number">0.5</Data></Cell></Row></Table></Worksheet></Workbook>';
    const xlmlDated = SheetJS.read(xlmlDateStyle, { type: 'string', cellDates: true, cellNF: true }).Sheets.Dates;
    check(xlmlDated.A1.v.toISOString() === '1904-01-01T12:00:00.000Z' && xlmlDated.A1.z === 'm/d/yy' &&
      xlmlDated.A1.w === '1/1/04' && xlmlDated.B1.v === 0.5,
      'SheetJS SpreadsheetML reader lost the inherited date format or epoch');
    check(SheetJS.read(xlmlDateStyle, { type: 'string' }).Sheets.Dates.A1.v === 0.5,
      'SheetJS SpreadsheetML reader converted a date with cellDates disabled');
    const xlmlTallBook = utils.book_new({ '!ref': 'B2:E5',
      B2: { t: 'n', v: 1 }, E5: { t: 'n', v: 2 } });
    const xlmlTallXml = SheetJS.write(xlmlTallBook, { bookType: 'xlml', type: 'string' });
    const xlmlConverted = SheetJS.read(SheetJS.writeXLSX(reopenedXlml, { type: 'array' }), { cellStyles: true });
    const xlmlConvertedSheet = xlmlConverted.Sheets['T&X'];
    check(xlmlConvertedSheet.B1.v === '<tag>' && xlmlConvertedSheet.A1.l.Target === 'https://example.org/' &&
      xlmlConvertedSheet.A1.c[0].t === 'A & B\nReview' && xlmlConverted.Custprops.Reviewed === true &&
      xlmlConverted.Workbook.Names.some((name) => name.Name === 'Local' && name.Sheet === 0),
      'SheetJS SpreadsheetML to XLSX conversion lost cells, metadata or scoped names');
    const xlmlTruncated = SheetJS.read(xlmlTallXml, { type: 'string', sheetRows: 3 }).Sheets.Sheet1;
    check(xlmlTruncated['!ref'] === 'B2:E3' && xlmlTruncated['!fullref'] === 'B2:E5' &&
      xlmlTruncated.B2.v === 1 && xlmlTruncated.E5 === undefined,
      'SheetJS SpreadsheetML sheetRows lost projected dimensions or included excluded cells');

  }
</script>
