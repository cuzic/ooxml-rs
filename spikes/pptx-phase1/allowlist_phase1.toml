# ADR-0008 §6: proposed Phase 1 additions to codegen/allowlist/{pml,dml}.toml.
# All are [read] entries (Phase 1 writes only text, through the Phase 0
# [write] entries). Checked by allowlist_p1.py (names exist, descent edges
# are generated ChildOf pairs, percentage attributes) and by a trial
# `cargo xtask codegen` in a scratch copy (README).

[pml.read]
names = [
    # part roots reached through the chain and notes
    "p:CT_SlideLayout/p:sldLayout",
    "p:CT_SlideMaster/p:sldMaster",
    "p:CT_NotesSlide/p:notes",
    "p:CT_NotesMaster/p:notesMaster",
    # text styles
    "p:CT_SlideMasterTextStyles/p:txStyles",
    "a:CT_TextListStyle/p:titleStyle",
    "a:CT_TextListStyle/p:bodyStyle",
    "a:CT_TextListStyle/p:otherStyle",
    "a:CT_TextListStyle/p:notesStyle",
    "a:CT_TextListStyle/p:defaultTextStyle",
    # colour mapping
    "a:CT_ColorMapping/p:clrMap",
    "a:CT_ColorMappingOverride/p:clrMapOvr",
    # geometry and shape style
    "a:CT_ShapeProperties/p:spPr",
    "a:CT_GroupShapeProperties/p:grpSpPr",
    "a:CT_Transform2D/p:xfrm",
    "a:CT_ShapeStyle/p:style",
    "p:CT_SlideSize/p:sldSz",
    # transitions (kinds are read by QName; see ADR-0008 §3.4)
    "p:CT_SlideTransition/p:transition",
    "p:CT_TransitionSoundAction/p:sndAc",
    # timing summary
    "p:CT_SlideTiming/p:timing",
    "p:CT_BuildList/p:bldLst",
    "p:CT_TLBuildParagraph/p:bldP",
    "p:CT_TLCommonTimeNodeData/p:cTn",
    "p:CT_TLShapeTargetElement/p:spTgt",
    "p:CT_TLTextTargetElement/p:txEl",
    "p:CT_IndexRange/p:pRg",
    "p:CT_IndexRange/p:charRg",
    # legacy comments
    "p:CT_CommentList/p:cmLst",
    "p:CT_Comment/p:cm",
    "a:CT_Point2D/p:pos",
    "xsd:string/p:text",
    "p:CT_CommentAuthorList/p:cmAuthorLst",
    "p:CT_CommentAuthor/p:cmAuthor",
    # sections (p14, inside the presentation extension list)
    "p:CT_PresentationExtensionList/p:extLst",
    "p:CT_PresentationExtension/p:ext",
    "p14:CT_SectionList/p14:sectionLst",
    "p14:CT_Section/p14:section",
    "p14:CT_SectionSlideIdList/p14:sldIdLst",
    "p14:CT_SectionSlideIdListEntry/p14:sldId",
    # modern comments (p188); anchors (ac:/pc: monikers) stay raw as in Phase 0
    "p188:CT_CommentList/p188:cmLst",
    "p188:CT_Comment/p188:cm",
    "a:CT_Point2D/p188:pos",
    "a:CT_TextBody/p188:txBody",
    "p188:CT_CommentReplyList/p188:replyLst",
    "p188:CT_CommentReply/p188:reply",
    "p188:CT_AuthorList/p188:authorLst",
    "p188:CT_Author/p188:author",
]

