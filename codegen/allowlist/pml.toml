# PresentationML allowlist (feature `pml`), ADR-0002 §5, ADR-0005 §5.
# An entry's feature group is the file it is listed in; entries whose SDK
# schema file is PML go here even when their complex type is DrawingML
# (`a:CT_TextBody/p:txBody`, `a:CT_NonVisualDrawingProps/p:cNvPr`).

# Phase0 write path: paragraphs are inserted into / removed from shape text.
[write]
names = [
    # Phase 0 text and Phase 3a formatting share this write path.
    "a:CT_TextBody/p:txBody",
    # Phase 2 (ADR-0012 §11): the slide list, sections, creationId,
    # viewProps outline entries and docProps/app.xml counts.
    "p:CT_Presentation/p:presentation",
    "p:CT_SlideIdList/p:sldIdLst",
    "p:CT_SlideIdListEntry/p:sldId",
    "p:CT_PresentationExtensionList/p:extLst",
    "p:CT_PresentationExtension/p:ext",
    "p14:CT_SectionList/p14:sectionLst",
    "p14:CT_Section/p14:section",
    "p14:CT_SectionSlideIdList/p14:sldIdLst",
    "p14:CT_SectionSlideIdListEntry/p14:sldId",
    "p:CT_Slide/p:sld",
    "p:CT_CommonSlideData/p:cSld",
    "p:CT_CommonSlideDataExtensionList/p:extLst",
    "p:CT_CommonSlideDataExtension/p:ext",
    "p:CT_NotesSlide/p:notes",
    "p14:CT_RandomId/p14:creationId",
    "p:CT_SlideExtensionList/p:extLst",
    "p:CT_SlideExtension/p:ext",
    "p:CT_ViewProperties/p:viewPr",
    "p:CT_OutlineViewProperties/p:outlineViewPr",
    "p:CT_OutlineViewSlideList/p:sldLst",
    "p:CT_OutlineViewSlideEntry/p:sld",
    "ap:CT_Properties/ap:Properties",
    "xsd:int/ap:Slides",
    "xsd:int/ap:Notes",
    "xsd:int/ap:HiddenSlides",
    # Phase 1b (ADR-0013 §2): the frame size follows row heights and widths.
    "a:CT_Transform2D/p:xfrm",
]

# Phase0 read-only: slide list, shape tree, shape ids/names, placeholders.
# p:pic / p:cxnSp / p:contentPart are listed so every shape kind's id is
# reachable for the duplicate-id check (review M5).
[read]
names = [
    # ADR-0008 (Phase 1 deck reading), §6
    "p:CT_SlideLayout/p:sldLayout",
    "p:CT_SlideMaster/p:sldMaster",
    "p:CT_NotesMaster/p:notesMaster",
    "p:CT_SlideMasterTextStyles/p:txStyles",
    "a:CT_TextListStyle/p:titleStyle",
    "a:CT_TextListStyle/p:bodyStyle",
    "a:CT_TextListStyle/p:otherStyle",
    "a:CT_TextListStyle/p:notesStyle",
    "a:CT_TextListStyle/p:defaultTextStyle",
    "a:CT_ColorMapping/p:clrMap",
    "a:CT_ColorMappingOverride/p:clrMapOvr",
    "a:CT_ShapeProperties/p:spPr",
    "a:CT_GroupShapeProperties/p:grpSpPr",
    "a:CT_ShapeStyle/p:style",
    "p:CT_SlideSize/p:sldSz",
    "p:CT_SlideTransition/p:transition",
    "p:CT_TransitionSoundAction/p:sndAc",
    "p:CT_SlideTiming/p:timing",
    "p:CT_BuildList/p:bldLst",
    "p:CT_TLBuildParagraph/p:bldP",
    "p:CT_TLCommonTimeNodeData/p:cTn",
    "p:CT_TLShapeTargetElement/p:spTgt",
    "p:CT_TLTextTargetElement/p:txEl",
    "p:CT_IndexRange/p:pRg",
    "p:CT_IndexRange/p:charRg",
    "p:CT_CommentList/p:cmLst",
    "p:CT_Comment/p:cm",
    "a:CT_Point2D/p:pos",
    "xsd:string/p:text",
    "p:CT_CommentAuthorList/p:cmAuthorLst",
    "p:CT_CommentAuthor/p:cmAuthor",
    "p188:CT_CommentList/p188:cmLst",
    "p188:CT_Comment/p188:cm",
    "a:CT_Point2D/p188:pos",
    "a:CT_TextBody/p188:txBody",
    "p188:CT_CommentReplyList/p188:replyLst",
    "p188:CT_CommentReply/p188:reply",
    "p188:CT_AuthorList/p188:authorLst",
    "p188:CT_Author/p188:author",
    "p:CT_GroupShape/p:spTree",
    "p:CT_GroupShape/p:grpSp",
    "p:CT_GroupShapeNonVisual/p:nvGrpSpPr",
    "p:CT_Shape/p:sp",
    "p:CT_ShapeNonVisual/p:nvSpPr",
    "a:CT_NonVisualDrawingProps/p:cNvPr",
    "p:CT_ApplicationNonVisualDrawingProps/p:nvPr",
    "p:CT_Placeholder/p:ph",
    "p:CT_GraphicalObjectFrame/p:graphicFrame",
    "p:CT_GraphicalObjectFrameNonVisual/p:nvGraphicFramePr",
    "p:CT_Picture/p:pic",
    "p:CT_PictureNonVisual/p:nvPicPr",
    "p:CT_Connector/p:cxnSp",
    "p:CT_ConnectorNonVisual/p:nvCxnSpPr",
    "p:CT_ContentPart/p:contentPart",
]
