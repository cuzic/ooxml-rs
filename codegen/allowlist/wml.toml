# WordprocessingML allowlist (feature `wml`), ADR-0002 §5, ADR-0004 §4.
# Entries are SDK `Name`s ((complex type, element) pairs).
#
# [write]: `*View` + `*ViewMut` (typed setters, insert/remove helpers).
# [read]:  `*View` only. `ChildOf` impls exist between any two allowlisted
#          entries, so `ooxml-docx` descends with the generic `LensMut`
#          primitives through read entries (document, tbl, tr, tc, hyperlink).
#          `ChildOf` is therefore not a compile-time "write allowed" proof; the
#          domain layer decides what it writes (ADR-0004 rev 2, §4).

# Word Phase0 write path: append a paragraph to the body; replace run content.
[write]
names = [
    # Word Phase3b (ADR-0015 §3 and §10).
    "w:CT_Comments/w:comments",
    "w:CT_Comment/w:comment",
    "w:CT_Markup/w:commentReference",
    "w:CT_MarkupRange/w:commentRangeStart",
    "w:CT_MarkupRange/w:commentRangeEnd",
    "w:CT_Empty/w:annotationRef",
    "w15:CT_CommentsEx/w15:commentsEx",
    "w15:CT_CommentEx/w15:commentEx",
    "w15:CT_People/w15:people",
    "w15:CT_Person/w15:person",
    "w15:CT_PresenceInfo/w15:presenceInfo",
    "w16cid:CT_CommentsIds/w16cid:commentsIds",
    "w16cid:CT_CommentId/w16cid:commentId",
    "w16cex:CT_CommentsExtensible/w16cex:commentsExtensible",
    "w16cex:CT_CommentExtensible/w16cex:commentExtensible",
    "w:CT_Body/w:body",
    "w:CT_P/w:p",
    "w:CT_R/w:r",
    "w:CT_Text/w:t",
    "w:CT_Empty/w:tab",
    "w:CT_Br/w:br",
    # Word Phase1 (ADR-0007 §4, §5, §6.3): property containers, the direct
    # formatting subset, style references, the updateFields opt-in.
    "w:CT_OnOff/w:b",
    "w:CT_OnOff/w:bCs",
    "w:CT_OnOff/w:i",
    "w:CT_OnOff/w:iCs",
    "w:CT_OnOff/w:strike",
    "w:CT_Underline/w:u",
    "w:CT_Color/w:color",
    "w:CT_HpsMeasure/w:sz",
    "w:CT_HpsMeasure/w:szCs",
    "w:CT_Highlight/w:highlight",
    "w:CT_VerticalAlignRun/w:vertAlign",
    "w:CT_Fonts/w:rFonts",
    "w:CT_Jc/w:jc",
    "w:CT_Spacing/w:spacing",
    "w:CT_Ind/w:ind",
    "w:CT_OnOff/w:keepNext",
    "w:CT_OnOff/w:keepLines",
    "w:CT_String/w:pStyle",
    "w:CT_String253/w:rStyle",
    # Word Phase2 (ADR-0011 §4, §6, §9.1): hyperlinks, section breaks,
    # inserted paragraphs.
    "w:CT_Hyperlink/w:hyperlink",
    "w:CT_SectPr/w:sectPr",
    "w:CT_SectType/w:type",
    "w:CT_HdrFtrRef/w:headerReference",
    "w:CT_HdrFtrRef/w:footerReference",
    "w:CT_PageNumber/w:pgNumType",
    "w:CT_LineNumber/w:lnNumType",
    # Word Phase2 part 2 (ADR-0011 §7): tables.
    "w:CT_Tbl/w:tbl",
    "w:CT_Row/w:tr",
    "w:CT_Tc/w:tc",
    "w:CT_TblGrid/w:tblGrid",
    "w:CT_TblGridCol/w:gridCol",
    "w:CT_TcPr/w:tcPr",
    "w:CT_VMerge/w:vMerge",
    "w:CT_DecimalNumber/w:gridSpan",
    "w:CT_TblWidth/w:tcW",
    "w:CT_TrPr/w:trPr",
    "w:CT_TblPrEx/w:tblPrEx",
    "w:CT_DecimalNumber/w:gridBefore",
    "w:CT_DecimalNumber/w:gridAfter",
    # Word Phase2 part 2 (ADR-0011 §3, §11): inline images. The wp and pic
    # entries are listed here rather than in a new wpd.toml group (Q7): the
    # generator's groups are features, and only ooxml-docx uses them.
    "w:CT_Drawing/w:drawing",
    "wp:CT_Inline/wp:inline",
    "a:CT_PositiveSize2D/wp:extent",
    "wp:CT_EffectExtent/wp:effectExtent",
    "a:CT_NonVisualDrawingProps/wp:docPr",
    "a:CT_NonVisualGraphicFrameProperties/wp:cNvGraphicFramePr",
    "pic:CT_Picture/pic:pic",
    "pic:CT_PictureNonVisual/pic:nvPicPr",
    "a:CT_NonVisualDrawingProps/pic:cNvPr",
    "a:CT_NonVisualPictureProperties/pic:cNvPicPr",
    "a:CT_BlipFillProperties/pic:blipFill",
    "a:CT_ShapeProperties/pic:spPr",
    # Word Phase2 part 3 (ADR-0011 §5, §5a, §8).
    "w:CT_Bookmark/w:bookmarkStart",
    "w:CT_MarkupRange/w:bookmarkEnd",
    "w:CT_NumPr/w:numPr",
    "w:CT_NonNegativeDecimalNumber255/w:ilvl",
    "w:CT_NonNegativeDecimalNumber/w:numId",
    "w:CT_Numbering/w:numbering",
    "w:CT_AbstractNum/w:abstractNum",
    "w:CT_Num/w:num",
    "w:CT_NonNegativeDecimalNumber/w:abstractNumId",
    "w:CT_Lvl/w:lvl",
    "w:CT_NumLvl/w:lvlOverride",
    "w:CT_DecimalNumber/w:startOverride",
    "w:CT_NonNegativeDecimalNumber/w:start",
    "w:CT_NumFmt/w:numFmt",
    "w:CT_LongHexNumber/w:nsid",
    "w:CT_LevelText/w:lvlText",
    "w:CT_LevelJustification/w:lvlJc",
    "w:CT_MultiLevelType/w:multiLevelType",
    "w:CT_String253/w:basedOn",
    "w:CT_String253/w:next",
    "w:CT_OnOffOnly/w:qFormat",
    "w:CT_PPrStyle/w:pPr",
    "w:CT_RPrStyle/w:rPr",
    "w:CT_PPrBase/w:pPr",
    "w:CT_Styles/w:styles",
    "w:CT_Style/w:style",
    "w:CT_StyleName/w:name",
]

# (ADR-0011 §7 reads w:hMerge raw.)
# Word Phase0 read-only: navigation to runs (document, tables, hyperlinks),
# run content classification, field markers, revisions, and the settings
# flags behind the document-level write gates.
[read]
names = [
    "w:CT_Document/w:document",
    "w:CT_PPr/w:pPr",
    "w:CT_RPr/w:rPr",
    "w:CT_Empty/w:cr",
    "w:CT_Empty/w:noBreakHyphen",
    "w:CT_Empty/w:softHyphen",
    "w:CT_Empty/w:lastRenderedPageBreak",
    "w:CT_FldChar/w:fldChar",
    "w:CT_Text/w:instrText",
    "w:CT_Text/w:delInstrText",
    "w:CT_SimpleField/w:fldSimple",
    "w:CT_RunTrackChange/w:ins",
    "w:CT_RunTrackChange/w:del",
    "w:CT_RunTrackChange/w:moveFrom",
    "w:CT_RunTrackChange/w:moveTo",
    "w:CT_Text/w:delText",
    "w:CT_Settings/w:settings",
    "w:CT_OnOff/w:trackRevisions",
    "w:CT_OnOff/w:updateFields",
    "w:CT_DocProtect/w:documentProtection",
    # Word Phase1 (ADR-0007 §2): story roots and note/comment containers.
    # Write paths descend through them to paragraphs and runs.
    "w:CT_HdrFtr/w:hdr",
    "w:CT_HdrFtr/w:ftr",
    "w:CT_Footnotes/w:footnotes",
    "w:CT_FtnEdn/w:footnote",
    "w:CT_Endnotes/w:endnotes",
    "w:CT_FtnEdn/w:endnote",
    # ADR-0015 §4: note references, separators, and settings.
    "w:CT_FtnEdnRef/w:footnoteReference",
    "w:CT_FtnEdnRef/w:endnoteReference",
    "w:CT_Empty/w:footnoteRef",
    "w:CT_Empty/w:endnoteRef",
    "w:CT_Empty/w:separator",
    "w:CT_Empty/w:continuationSeparator",
    "w:CT_FtnDocProps/w:footnotePr",
    "w:CT_EdnDocProps/w:endnotePr",
    "w:CT_FtnEdnSepRef/w:footnote",
    "w:CT_FtnEdnSepRef/w:endnote",
    # Word Phase1 (ADR-0007 §5): style lookup.
]

# Word Phase2 (ADR-0011 §11): copied by detach_as. pPr is copied without
# sectPr and pPrChange (skipped); a paragraph mark holding revision elements
# (w:id) is refused before copying. sectPr is copied without its header and
# footer references (r:id), which are written again with typed setters.
[detach]
names = [
    "w:CT_RPr/w:rPr",
    "w:CT_NumLvl/w:lvlOverride",
    "w:CT_PPr/w:pPr",
    "w:CT_SectPr/w:sectPr",
    # ADR-0011 §7: row and cell properties of template rows; the revision
    # children (ins/del/trPrChange, tcPrChange/cellIns/cellDel/cellMerge,
    # tblPrExChange) are refused before copying, tblHeader, gridSpan,
    # vMerge, hMerge and tcW are skipped where §7 says so.
    "w:CT_TrPr/w:trPr",
    "w:CT_TcPr/w:tcPr",
    "w:CT_TblPrEx/w:tblPrEx",
]
