    "x:CT_MergeCells/x:mergeCells",
    "x:CT_MergeCell/x:mergeCell",
    "x:CT_AutoFilter/x:autoFilter",
    "x:CT_SheetProtection/x:sheetProtection",
    # Phase4 part 2 (ADR-0014 §4–§6, §8–§11): hyperlinks, data validation,
    # conditional formatting, views, columns, page setup, workbook protection.
    "x:CT_DataValidations/x:dataValidations",
    "x:CT_DataValidation/x:dataValidation",
    "x:CT_Xstring/x:formula1",
    "x:CT_Xstring/x:formula2",
    "x:CT_ConditionalFormatting/x:conditionalFormatting",
    "x:CT_CfRule/x:cfRule",
    "x:CT_Xstring/x:formula",
    "x:CT_Cfvo/x:cfvo",
    "x:CT_ColorScale/x:colorScale",
    "x:CT_DataBar/x:dataBar",
    "x:CT_IconSet/x:iconSet",
    "x:CT_Pane/x:pane",
    "x:CT_Selection/x:selection",
    "x:CT_Cols/x:cols",
    "x:CT_Col/x:col",
    "x:CT_SheetFormatPr/x:sheetFormatPr",
    "x:CT_PageSetup/x:pageSetup",
    "x:CT_PageMargins/x:pageMargins",
    "x:CT_PrintOptions/x:printOptions",
    "x:CT_HeaderFooter/x:headerFooter",
    "x:CT_Xstring/x:oddHeader",
    "x:CT_Xstring/x:oddFooter",
    "x:CT_Xstring/x:evenHeader",
    "x:CT_Xstring/x:evenFooter",
    "x:CT_Xstring/x:firstHeader",
    "x:CT_Xstring/x:firstFooter",
    "x:CT_PageBreak/x:rowBreaks",
    "x:CT_PageBreak/x:colBreaks",
    "x:CT_Break/x:brk",
    "x:CT_PageSetUpPr/x:pageSetUpPr",
    "x:CT_WorkbookProtection/x:workbookProtection",
    "x:CT_WorksheetExtensionList/x:extLst",
    "x:CT_CfRuleExtensionList/x:extLst",
    "x:CT_CfRuleExtension/x:ext",
    "x:CT_WorksheetExtension/x:ext",
]

# Phase0 read-only: formulas (writes are refused by ADR-0001), locating the
# first sheet, shared/rich strings, merged ranges, table header rows.
[read]
names = [
    # ADR-0017 §3.3, ECMA-376 §18.9.
    "x:CT_MetadataBlocks/x:cellMetadata",
    "x:CT_ExtensionList/x:extLst",
    "x:CT_Extension/x:ext",
    "x:CT_Metadata/x:metadata",
    "x:CT_MetadataTypes/x:metadataTypes",
    "x:CT_MetadataType/x:metadataType",
    "x:CT_FutureMetadata/x:futureMetadata",
    "x:CT_MetadataBlocks/x:valueMetadata",
    "x:CT_MetadataBlock/x:bk",
    "x:CT_FutureMetadataBlock/x:bk",
    "x:CT_MetadataRecord/x:rc",
    # Phase4 part 1 (ADR-0014 §7): an autofilter with criteria or a sort is
    # refused, so these are only detected.
    "x:CT_FilterColumn/x:filterColumn",
    "x:CT_SortState/x:sortState",
    # Table header guard (roadmap Q5): tableParts -> table part -> ref/headerRowCount.
    "x:CT_TableParts/x:tableParts",
    "x:CT_TablePart/x:tablePart",
    "x:CT_Table/x:table",
    "x:CT_TableColumns/x:tableColumns",
    "x:CT_TableColumn/x:tableColumn",
    "x:CT_TableStyleInfo/x:tableStyleInfo",
    "x:CT_TableFormula/x:calculatedColumnFormula",
    "x:CT_TableFormula/x:totalsRowFormula",
    # Phase3 (ADR-0009): views keyed by sheetId, VBA code names.
    "x:CT_CustomWorkbookViews/x:customWorkbookViews",
    "x:CT_CustomWorkbookView/x:customWorkbookView",
    # Phase2 (ADR-0006): the default style, named styles, the date system.
    "x:CT_CellStyleXfs/x:cellStyleXfs",
    "x:CT_CellStyles/x:cellStyles",
    "x:CT_CellStyle/x:cellStyle",
    "x:CT_WorkbookPr/x:workbookPr",
]
