# Corrections to the vendored inputs (ADR-0002 §1.3). The vendored data is
# never edited; every change lives here, with a reason and evidence.
#
# Operations (`op`): add_attribute, add_child, add_enum_value, set_default,
# mce_wrapped, set_content, set_type. An override `on` an abstract entry
# (`w:CT_OnOff/`) is inherited by every entry with the same complex-type part,
# across schema files; an override on the entry itself takes precedence.
#
# Example (not active):
#
# [[override]]
# op = "set_default"
# on = "w:CT_OnOff/"
# attribute = "w:val"
# value = "true"
# reason = "<w:b/> means on; the XSD leaves this to prose"
# evidence = "ECMA-376 Part 1, 17.17.4 (ST_OnOff)"

# ---- wml (ADR-0004 §4) ----

[[override]]
op = "set_default"
on = "w:CT_OnOff/"
attribute = "w:val"
value = "true"
reason = "WML on/off elements mean 'on' when val is omitted (<w:trackRevisions/>); the XSD (CT_OnOff, ST_OnOff) gives no default and leaves it to prose. ADR-0004's TrackRevisionsOn gate depends on it."
evidence = "reference/fixtures/docx/poi-delins.docx (word/settings.xml: <w:trackRevisions/>); ECMA-376 Part 1, 17.17.4 ST_OnOff and the val description of each on/off property (e.g. 17.3.2.1 b)"

# ---- dml (ADR-0013 §2, row and column ids; ADR-0002 note "children of a
# wildcard-only parent") ----

[[override]]
op = "add_child"
parent = "a:CT_OfficeArtExtension/a:ext"
name = "a16:CT_Identifier/a16:rowId"
before = "##any"
reason = "a:ext's content is a single xsd:any, so codegen emits no ChildOf<a:ext> and a16:rowId cannot be created through the typed lens (ADR-0013 review round 3 P1). PowerPoint writes a:tr/a:extLst/a:ext[@uri={0D108BD9-81ED-4DB2-BD59-A6C34878D82A}]/a16:rowId; inserting a new table row needs one."
evidence = "152 a16:rowId in the ADR-0013 corpus, all under that a:ext URI (spikes/pptx-phase1b/results/tables_smartart-619.txt); ECMA-376 Part 1 §20.1.2.2.15 (ext: any content); [MS-ODRAWXML] 2.3.1.4 (a16:rowId)"

[[override]]
op = "add_child"
parent = "a:CT_OfficeArtExtension/a:ext"
name = "a16:CT_Identifier/a16:colId"
before = "##any"
reason = "As a16:rowId: a:tblGrid/a:gridCol/a:extLst/a:ext[@uri={9D8B030D-6E8A-4147-A177-3AD203B41FA5}]/a16:colId for a new table column (ADR-0013 §2)."
evidence = "135 a16:colId in the ADR-0013 corpus, all under that a:ext URI (spikes/pptx-phase1b/results/tables_smartart-619.txt); [MS-ODRAWXML] 2.3.1.3 (a16:colId)"

