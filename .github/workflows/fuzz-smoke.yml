name: Fuzz smoke

# Short robustness runs over the untrusted-input surface (ooxml-core's zip
# and XML readers, the lens, ooxml-xlsx, ooxml-pptx). Not part of ci.yml:
# run it by hand, or let the weekly schedule catch regressions.
# Findings: docs/testing/fuzz-findings-2026-11.md; harness and how-to:
# fuzz/README.md.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "cargo-fuzz time per target (seconds)"
        default: "60"
      smoke_iters:
        description: "OOXML_SMOKE_ITERS for the stable smoke test"
        default: "50"
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  stable-smoke:
    name: stable property smoke (Rust 1.99, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: smoke
        env:
          OOXML_SMOKE_ITERS: ${{ inputs.smoke_iters || '50' }}
        run: cargo test --release -p ooxml-robustness --test smoke
      - name: keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures
          path: target/tmp/smoke-failures/
          if-no-files-found: ignore

  cargo-fuzz:
    name: cargo-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [package_roundtrip, xml_t1, xml_t1b, lens_ops, xlsx_edit, pptx_edit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: seed corpus from reference/fixtures
        run: cargo +nightly run -q -p ooxml-robustness --example seed_corpus -- fuzz/corpus
      - name: fuzz
        working-directory: fuzz
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} --
          -max_total_time=${{ inputs.seconds || '60' }} -timeout=10 -rss_limit_mb=2048
      - name: keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
