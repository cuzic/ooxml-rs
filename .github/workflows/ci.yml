name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test, clippy, codegen --check (Rust 1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo xtask codegen --check
        run: cargo xtask codegen --check
      - name: cargo xtask pptx-template --check
        run: cargo xtask pptx-template --check

  pptx-readback:
    # ADR-0005 §7 T3, independent half: python-pptx (pinned) reads every
    # edited output and its input; check.py compares with the expected
    # model and with ooxml-pptx's own read.
    # Also ADR-0008 §7 O5: deck-wide find/replace cases, redone by check.py. Separate job so the Rust job is
    # not slowed down; it builds one example in release mode.
    name: pptx T3 read-back (python-pptx 1.0.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install python-pptx
        run: python -m pip install -r crates/ooxml-pptx/tests/oracle/requirements.txt
      - name: write oracle cases
        run: cargo run --release -p ooxml-pptx --example oracle_cases -- "$RUNNER_TEMP/pptx-oracle"
      - name: python-pptx read-back
        run: python -I crates/ooxml-pptx/tests/oracle/check.py "$RUNNER_TEMP/pptx-oracle" reference/fixtures/pptx
      - name: write Phase 2 structure cases (ADR-0012 §10)
        run: cargo run --release -p ooxml-pptx --example structure_cases -- "$RUNNER_TEMP/pptx-structure"
      - name: python-pptx structure oracle
        run: python -I crates/ooxml-pptx/tests/oracle/structure.py "$RUNNER_TEMP/pptx-structure" reference/fixtures/pptx
      - name: write Phase 1b table cases (ADR-0013 §7)
        run: cargo run --release -p ooxml-pptx --example table_cases -- "$RUNNER_TEMP/pptx-tables"
      - name: python-pptx table read-back
        run: python -I crates/ooxml-pptx/tests/oracle/tables.py "$RUNNER_TEMP/pptx-tables" reference/fixtures/pptx
      # ADR-0008 §7 O1 (placeholder geometry) and O3 (links) vs python-pptx
      - name: resolved geometry and links
        run: |
          cargo run --release -p ooxml-pptx --example resolve_dump -- "$RUNNER_TEMP/pptx-resolve.json"
          python -I crates/ooxml-pptx/tests/oracle/resolve_check.py "$RUNNER_TEMP/pptx-resolve.json" reference/fixtures/pptx

      - name: write SmartArt cases (ADR-0013 §7)
        run: cargo run --release -p ooxml-pptx --example smartart_cases -- "$RUNNER_TEMP/pptx-smartart"
      - name: SmartArt data/cache check
        run: python -I crates/ooxml-pptx/tests/oracle/smartart.py "$RUNNER_TEMP/pptx-smartart" reference/fixtures/pptx

  docx-readback:
    name: docx registry read-back (python-docx 1.2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install python-docx
        run: python -m pip install python-docx==1.2.0
      - name: write oracle cases
        run: cargo run --release -p ooxml-docx --example docx_manual_check -- "$RUNNER_TEMP/docx-oracle"
      - name: python-docx registry oracle (ADR-0011 §12)
        run: python -I crates/ooxml-docx/tests/oracle/phase2_registries.py "$RUNNER_TEMP/docx-oracle"

  xlsx-readback:
    name: xlsx table read-back (openpyxl 3.1.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install openpyxl
        run: python -m pip install openpyxl==3.1.5
      - name: write manual-check cases
        run: cargo run --release -p ooxml-xlsx --example xlsx_manual_check -- "$RUNNER_TEMP/xlsx-oracle"
      - name: openpyxl table read-back (ADR-0017 P5b)
        run: python -I crates/ooxml-xlsx/tests/oracle/tables.py "$RUNNER_TEMP/xlsx-oracle" && python -I crates/ooxml-xlsx/tests/oracle/comments.py "$RUNNER_TEMP/xlsx-oracle"

  python:
    # ADR-0023 §10: the binding workspace. No path filter: runs on every push
    # and PR, so a Rust change that breaks the binding fails CI.
    name: Python binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/python
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # the abi3 floor
      - run: python -m pip install -r requirements-ci.txt
      - name: workspace metadata matches the root
        run: python -I ci/check_manifest.py ../../Cargo.toml Cargo.toml
      - run: cargo clippy --locked --all-targets --features fault-injection -- -D warnings
      - name: build wheels (release, and a fault-injection test build)
        run: |
          maturin build --locked --release -o dist
          # --features overrides tool.maturin.features, so repeat the abi3 pair.
          maturin build --locked --release --features pyo3/extension-module,pyo3/abi3-py310,fault-injection -o dist-fi
      - name: test the release wheel in a fresh venv
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bindir=Scripts; else bindir=bin; fi
          # pytest pin mirrors requirements-ci.txt (kept in sync by hand).
          python -m venv .venv-rel
          .venv-rel/$bindir/python -m pip install dist/*.whl "pytest==9.2.0"
          .venv-rel/$bindir/python -I -m pytest tests -m "not fault_injection"
      - name: test the fault-injection wheel
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bindir=Scripts; else bindir=bin; fi
          python -m venv .venv-fi
          .venv-fi/$bindir/python -m pip install dist-fi/*.whl "pytest==9.2.0"
          .venv-fi/$bindir/python -I -m pytest tests -m fault_injection
