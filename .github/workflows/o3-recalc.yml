name: O3 recalculation data (manual)

# ADR-0003 §7.1 oracle O3 (xlsx Phase1): LibreOffice hard-recalculates the
# O3 inputs and outputs written by `examples/o3_inputs.rs`; the resulting
# TSV is uploaded as an artifact for the owner to review and commit to
# reference/fixtures/xlsx/o3/expected.tsv. Dispatch it against the branch
# that has the example and spikes/xlsx/o3_recalc.py (e.g. impl/xlsx-phase1).
#
# Reproducibility and integrity (review of PR #21):
# - LibreOffice is an exact release from the Document Foundation's permanent
#   archive, verified against a SHA-256 pinned below (mandatory; a version
#   without a pinned hash fails);
# - locale and time zone are fixed, the soffice version is asserted, and the
#   TSV header records the dispatched commit, the environment and the
#   Cargo.lock hash (Cargo.lock is not committed in this repository);
# - spikes/xlsx/o3_recalc.py and tests/phase1_o3.rs both require a canary
#   cell with a deliberately wrong cached value to come back recalculated;
# - actions are pinned to commit SHAs; the checkout keeps no credentials.
on:
  workflow_dispatch:
    inputs:
      libreoffice_version:
        description: "Exact LibreOffice release with a pinned SHA-256 below"
        required: true
        default: "25.2.7.2"

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  LO_VERSION: ${{ inputs.libreoffice_version }}

jobs:
  o3:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-16
        with:
          toolchain: "1.99"
      - name: Select pinned LibreOffice checksum
        id: libreoffice
        run: |
          case "$LO_VERSION" in
            25.2.7.2) echo "sha256=3f6a85c57d2d16a222b219b5eb42aacda82fa8ce9590c90e2f9b649c6e3d1581" >> "$GITHUB_OUTPUT" ;;
            *) echo "no pinned SHA-256 for LibreOffice $LO_VERSION"; exit 1 ;;
          esac
      - name: Cache LibreOffice tarball
        id: libreoffice-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/LibreOffice_${{ env.LO_VERSION }}_Linux_x86-64_deb.tar.gz
          key: libreoffice-linux-x86-64-deb-${{ env.LO_VERSION }}-${{ steps.libreoffice.outputs.sha256 }}
      - name: Download LibreOffice tarball
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          tgz="LibreOffice_${LO_VERSION}_Linux_x86-64_deb.tar.gz"
          url="https://downloadarchive.documentfoundation.org/libreoffice/old/${LO_VERSION}/deb/x86_64/$tgz"
          curl -fsSL --retry 5 --retry-all-errors -C - --connect-timeout 30 \
            --max-time 2100 --retry-max-time 3500 --output "$RUNNER_TEMP/$tgz" "$url"
      - name: Install LibreOffice (pinned version and SHA-256)
        env:
          LO_SHA256: ${{ steps.libreoffice.outputs.sha256 }}
        run: |
          set -euo pipefail
          tgz="LibreOffice_${LO_VERSION}_Linux_x86-64_deb.tar.gz"
          echo "$LO_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lo" && tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/lo"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP"/lo/*/DEBS/*.deb
          dir="/opt/libreoffice${LO_VERSION%.*.*}/program"
          "$dir/soffice" --version | grep -F "$LO_VERSION"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Write O3 inputs and outputs
        run: |
          cargo run -p ooxml-xlsx --example o3_inputs -- "$RUNNER_TEMP/o3"
          mkdir -p o3 && cp Cargo.lock o3/Cargo.lock
          echo "O3_CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Recalculate with LibreOffice
        env:
          O3_LIBREOFFICE_VERSION: ${{ inputs.libreoffice_version }}
        run: python3 -I spikes/xlsx/o3_recalc.py "$RUNNER_TEMP/o3" o3/expected.tsv
      - name: Check
        run: |
          mkdir -p reference/fixtures/xlsx/o3
          cp o3/expected.tsv reference/fixtures/xlsx/o3/expected.tsv
          cargo test -p ooxml-xlsx --test phase1_o3 -- --include-ignored --exact o3_kept_values_match_libreoffice_recalculation 2>&1 | tee o3/check.log
          grep -q "test result: ok. 1 passed" o3/check.log
      - name: Upload the data (success only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: o3-expected-${{ github.sha }}
          path: o3/
          if-no-files-found: error
      - name: Upload the data of a failed run (do not commit)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: o3-FAILED-${{ github.sha }}
          path: o3/
          if-no-files-found: ignore
